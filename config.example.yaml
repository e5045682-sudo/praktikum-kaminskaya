# Глобальные настройки по умолчанию для всех проектов.
# Скопируйте в config.yaml, чтобы переопределить значения из montage.py.
# Любое поле можно также переопределить внутри конкретного проекта
# (projects/<name>/config.yaml) — оно перекроет глобальное.

transition_duration: 0.5   # длительность кроссфейда между клипами, сек (0 — без перехода)
fps: 30
resolution: null           # например [1080, 1920] для вертикального видео; null — как в исходниках
music_volume: 0.2          # громкость фоновой музыки (0.0–1.0)
font: null                 # путь к .ttf шрифту для подписей; если null — берётся системный

avatar:
  position: bottom-right   # top-left | top-right | bottom-left | bottom-right
  width_ratio: 0.28        # ширина аватара относительно ширины видео
  margin: 24                # отступ от края кадра, px

# Команда агентов orchestrator.py и порядок их запуска для проекта.
# Можно переопределить внутри projects/<name>/config.yaml.
# Доступные агенты: montage, highlights, beautify, qa. По умолчанию
# (если поле не задано) запускаются только montage и qa.
# pipeline: [montage, qa]
