# Промо-ролик практикума (14-16 сентября). Субтитры под готовый сценарий,
# таймкоды взяты из самого текста сценария (см. секции ниже).
#
# Видео положите в clips/ (например 01_hook_promo.mp4) — общая длительность
# ролика должна быть около 60 сек, чтобы подписи совпадали с речью.
# Если ваша запись длиннее/короче — поправьте start/duration ниже под
# фактический хронометраж.

captions:
  # ХУК (0-3 сек, спокойно, с паузами)
  - text: "Вы меняли воронку. Меняли цену. Меняли нишу. А результат возвращается тот же. Почему?"
    start: 0
    duration: 3
    position: bottom
    font_size: 44

  # РАЗВИТИЕ (3-20 сек)
  - text: "Обычно говорят: дело в тебе. Я так сразу не скажу — и не отрицаю. У кого-то причина внутри, у кого-то в самой системе. Это выясняется индивидуально, а не назначается заранее."
    start: 3
    duration: 17
    position: bottom
    font_size: 40

  # СУТЬ (20-35 сек)
  - text: "Часто дело в системе связей — кто на кого влияет, какой сценарий повторяется. Эту петлю не видно изнутри: вы сами её часть. Со стороны — видно."
    start: 20
    duration: 15
    position: bottom
    font_size: 40

  # ПРЕДЛОЖЕНИЕ (35-50 сек)
  - text: "На практикуме мы не гадаем. За три дня находим точку, где механизм держит результат на месте. И вы видите её сами."
    start: 35
    duration: 15
    position: bottom
    font_size: 40

  # ПРИЗЫВ (50-60 сек)
  - text: "14-16 сентября, онлайн. Если узнали свою ситуацию — регистрация в профиле."
    start: 50
    duration: 10
    position: bottom
    font_size: 44
